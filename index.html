<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LubPub</title>
<link rel="icon" href="https://ehrencrona.org/favicon.ico">
<link rel="stylesheet" href="https://ehrencrona.org/shared.css">
<style>
  .note{margin:.85rem 0 0;font-size:.9rem;min-height:1.2em;color:var(--muted-light)}
  @media (prefers-color-scheme:dark){.note{color:var(--muted-dark)}}
  .note.error{color:var(--brand)}
</style>
</head>
<body>
<div class="page">
  <header class="brand-header">
    <a href="https://ehrencrona.org">
      <picture>
        <source srcset="https://ehrencrona.org/ehrencrona_logo_darkmode.png" media="(prefers-color-scheme: dark)">
        <img class="brand-logo" src="https://ehrencrona.org/ehrencrona_logo.png" alt="Ehrencrona logo">
      </picture>
    </a>
  </header>
  <main class="content">
    <div class="content-inner">
      <h1 class="home-title">LubPub Proxy</h1>
      <div class="card">
        <div class="search-wrap">
          <p class="card-desc">Paste an article link, a DOI or a PMID to open in a new tab</p>
          <div class="search-row">
            <input class="field" id="urlInput" type="search" placeholder="Link (https://…) , DOI (e.g. 10.1038/…) or PMID (e.g. 37563628)">
            <button class="search-btn" id="openBtn">Open</button>
          </div>
          <p class="note" id="note"></p>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
(() => {
  const input = document.getElementById('urlInput');
  const btn   = document.getElementById('openBtn');
  const note  = document.getElementById('note');

  const setNote = (msg, isError) => {
    note.textContent = msg || '';
    note.classList.toggle('error', !!isError);
  };

  const toludwig = url => {
    const clean = url.split('?')[0];
    const u     = new URL(clean);
    const host  = u.hostname.replace(/\./g, '-');
    return `${u.protocol}//${host}.ludwig.lub.lu.se${u.pathname}${u.search}`;
  };

  // Accepts "12345678", "PMID: 12345678", "doi:10.1038/nn.4000", plain URLs.
  const normalise = s => s.trim().replace(/^pmid[:\s]*/i, '').replace(/^doi[:\s]*/i, '');
  const isPmid    = s => /^\d+$/.test(s);
  const isDoi     = s => /^10\.\d{4,9}\/\S+$/.test(s);

  const resolvePmid = async pmid => {
    const res  = await fetch(`https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id=${pmid}&retmode=json`);
    const data = await res.json();
    const doi  = data.result?.[pmid]?.articleids?.find(a => a.idtype === 'doi');
    return doi ? doi.value : null;
  };

  // sameTab = true  -> deep link: redirect this tab (no pop-up, so no blocker)
  // sameTab = false -> button/Enter: open a new tab from the user's click
  const go = async (sameTab = false) => {
    const raw = normalise(input.value);
    if (!raw) return;
    setNote('');

    let win = null;
    if (!sameTab) {
      win = window.open('', '_blank');
      if (!win) {
        setNote('Your browser blocked the new tab. Allow pop-ups for lubpub.ehrencrona.org, then try again.', true);
        return;
      }
      win.document.write('<title>Opening…</title><body style="font-family:system-ui,sans-serif;padding:2rem;color:#666">Opening…</body>');
    }

    const land = url => {
      if (sameTab) {
        location.replace(url);
      } else {
        win.location.href = url;
        input.value = '';
        input.focus();
      }
    };
    const fail = msg => {
      if (win) win.close();
      setNote(msg, true);
    };

    btn.disabled = true;
    try {
      if (isPmid(raw)) {
        btn.textContent = 'Fetching DOI…';
        const doi = await resolvePmid(raw);
        if (!doi) return fail('No DOI found for that PMID. Check the number, or paste the article link instead.');
        land(toludwig(`https://doi.org/${doi}`));
      } else if (isDoi(raw)) {
        land(toludwig(`https://doi.org/${raw}`));
      } else {
        land(toludwig(raw));
      }
    } catch (e) {
      console.error(e);
      fail(isPmid(raw)
        ? 'NCBI did not respond. Check your connection and try again.'
        : 'That input could not be read. Enter a full link (with https://), a DOI, or a PMID.');
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Open';
    }
  };

  btn.addEventListener('click', () => go(false));
  input.addEventListener('keydown', e => (e.key === 'Enter') && go(false));

  // Deep links: ?pmid=25803835  ·  ?doi=10.1038/nn.4000  ·  ?url=<encoded link>
  const params = new URLSearchParams(location.search);
  const deep   = params.get('pmid') || params.get('doi') || params.get('url');
  if (deep) {
    input.value = deep;
    setNote('Opening…');
    go(true);
  }
})();
</script>
</body>
</html>
